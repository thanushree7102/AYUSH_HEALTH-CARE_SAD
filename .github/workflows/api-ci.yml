name: API Integration CI

on:
  push:
    branches: [api-integration]
  pull_request:
    branches: [main]

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: WhatsApp reader test
        run: npm run test:reader

      - name: Database isolation test
        run: npm run test:isolation

      - name: Acceptance tests
        run: npm test
