name: Database CI

on:
  push:
    branches: [database]
  pull_request:
    branches: [main]

jobs:
  database-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check libs/common/db.js
          node --check shared-platform/backend/db.js
          node --check shared-platform/backend/seed.js
          node --check scripts/seed-demo.js
